name: assetflow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  api:
    image: ${REGISTRY_PREFIX:-ghcr.io/yourname}/assetflow-backend:${ASSETFLOW_VERSION}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      APP_URL: ${APP_URL}
      CORS_ORIGIN: ${APP_URL}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      STORAGE_PATH: /var/lib/assetflow/documents
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    secrets:
      - postgres_password
      - jwt_private_key
      - jwt_public_key
      - data_encryption_key
    volumes:
      - document_data:/var/lib/assetflow/documents
    depends_on:
      db:
        condition: service_healthy
    expose: ["8080"]
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]

  web:
    image: ${REGISTRY_PREFIX:-ghcr.io/yourname}/assetflow-frontend:${ASSETFLOW_VERSION}
    restart: unless-stopped
    expose: ["8080"]
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  document_data:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  jwt_public_key:
    file: ./secrets/jwt_public.pem
  data_encryption_key:
    file: ./secrets/data_encryption_key.txt
