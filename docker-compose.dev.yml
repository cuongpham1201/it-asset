services:
  backend:
    image: assetflow-backend:dev
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile

  frontend:
    image: assetflow-frontend:dev
    pull_policy: build
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_DEMO_MODE: "false"
